- name: Configuring Payment Service for Roboshop
  hosts: payment
  become: yes 

  tasks:

  - name: Change hostname to payment
    hostname: 
      name: payment.trivikram.online

  - name: Install the packages - python3 gcc python3-devel
    package:
      name: "{{ item }}"
      state: present
    loop:
    - python3
    - gcc
    - python3-devel

  - name: create roboshop system user
    user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "Roboshop System user"

  - name: remove app directory
    file:
      path: /app
      state: absent

  - name: delete payment.zip in tmp directory
    file:
      path: /tmp/payment.zip
      state: absent

  - name: create app directory
    file:
      path: /app
      state: directory

  - name: download payment code .zip
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip 
      dest: /tmp/payment.zip

  - name: unzip payment.zip file
    unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes

  - name: Install the dependencies
    pip:
      requirements: requirements.txt
      executable: pip3.9
    args:
      chdir: /app
  
  - name: Copy the payment.service file
    template:
      src: payment.service.j2
      dest: /etc/systemd/system/payment.service
  
  - name: SystemD reload
    systemd_service:
      name: payment
      daemon_reload: true

  - name: Start and Enable the service
    service:
      name: payment
      state: restarted
      enabled: yes
