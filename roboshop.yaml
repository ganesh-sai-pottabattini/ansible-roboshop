#first need to do aws configure, pip3.9 install botocore boto3 netaddr
- name: Creating roboshop project using Ansible
  hosts: local
  connection: local
  vars:
    instances: [ "mongodb", "redis", "mysql", "rabbitmq" ]
    image_id: ami-0220d79f3f480ecf5
    domain_name: trivikram.online
  tasks:
  - name : Creating EC2 instances
    loop: "{{ instances }}"
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      image_id: "{{ image_id }}"
      instance_type: t3.micro
      security_groups: 
      - "{{item}}"
      - common
    register: ec2_output 

  - name:
    debug:
      #msg: " {{ ec2_output.results }}"
      var: ec2_output.results

  - name: create route 53 record
    debug: 
      msg: " Instance Name : {{ item.item }} Private IP: {{ item.Instances[0].private_ip_address }} "
    loop: "{{ ec2_output.results }}"

  - name: create R53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"
      type: A
      value: "{{ item.Instances[0].private_ip_address }}"
      ttl: 1
      overwrite: true # old records ni overwrite chesthundi
    loop: "{{ ec2_output.results }}"
    when: item.item != "frontend"


  - name: create R53 records for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      type: A
      value: "{{ item.Instances[0].public_ip_address }}"
      ttl: 1
      overwrite: true # old records ni overwrite chesthundi
    loop: "{{ ec2_output.results }}"
    when: item.item == "frontend"