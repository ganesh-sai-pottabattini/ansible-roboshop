- name: Configuring mySQL Server
  hosts: mysql
  become: yes
  tasks:
  - name: Change hostname
    hostname:
      name: mysql.trivikram.online

  - name: Install MySQL Server
    dnf:
      name: mysql-server
      state: present

  - name: Start and Enable MySQL Service
    service:
      name: mysqld
      state: started
      enabled: yes

  - name: setup root password
    command: mysql_secure_installation --set-root-pass RoboShop@1